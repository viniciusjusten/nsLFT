    OneDOneQGenerator: {
      name: "1d1q",
      description: "Modelo de dois eixos, com as tensões transitórias E′d e E′q dinâmicas, a tensão de campo Efd constante e a equação de oscilação.",
    },
    ConstantZLoad: {
      name: "Impedância constante",
      description: "Admitância fixa calculada com P0 e Q0 na tensão do fluxo de potência, de modo que a potência varia com |V|².",
    },
    line: {
      name: "Linha",
      description: "Modelo π com impedância série R + jX e a susceptância shunt B dividida entre as duas extremidades.",
    },
    transformer: {
      name: "Transformador",
      description: "Impedância série com tap fora do nominal do lado da barra de origem.",
    },
  };
}

function describeModel(model) {
  const info = modelInfo();
  if (model in info) {
    return info[model];
  }
  return { name: model, description: "" };
}

function eventTypeLabel(type) {
  const labels = {
    ShortCircuit: "Curto-circuito",
    ShortCircuitRemoval: "Eliminação do curto-circuito",
    CircuitTrip: "Desligamento de circuito",
    GeneratorTrip: "Desligamento de gerador",
    LoadChange: "Variação de carga",
  };
  if (type in labels) {
    return labels[type];
  }
  return type;
}

function kindLabel(kind, element) {
  if (kind === "bus") {
    return "Barra";
  }
  if (kind === "circuit") {
    if (element.type === "transformer") {
      return "Transformador";
    }
    return "Linha";
  }
  if (kind === "generator") {
    return "Gerador";
  }
  if (kind === "load") {
    return "Carga";
  }
  return kind;
}

function collectionOf(description, kind) {
  if (kind === "bus") {
    return description.buses;
  }
  if (kind === "circuit") {
    return description.circuits;
  }
  if (kind === "generator") {
    return description.generators;
  }
  if (kind === "load") {
    return description.loads;
  }
  return [];
}

function elementOf(description, kind, index) {
  const list = collectionOf(description, kind);
  if (index < 0 || index >= list.length) {
    return null;
  }
  return list[index];
}

function findQuantity(quantities, key) {
  for (const quantity of quantities) {
    if (quantity.key === key) {
      return quantity;
    }
  }
  return null;
}

function quantityValue(quantities, key, unit) {
  const quantity = findQuantity(quantities, key);
  if (quantity === null) {
    return NaN;
  }
  for (const entry of quantity.values) {
    if (entry.unit === unit && entry.value !== null) {
      return entry.value;
    }
  }
  return NaN;
}

function formatEntry(entry) {
  if (entry.value === null) {
    return "–";
  }
  const text = formatValue(entry.value);
  if (entry.unit === "deg") {
    return text + "°";
  }
  if (entry.unit === "") {
    return text;
  }
  return text + " " + entry.unit;
}

function formatFixed(value, decimals) {
  if (Number.isNaN(value)) {
    return "–";
  }
  // A value that rounds to zero is written without the sign that a tiny negative number would keep.
  const smallest = 0.5 * Math.pow(10, -decimals);
  if (Math.abs(value) < smallest) {
    value = 0;
  }
  return value.toLocaleString("pt-BR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

// The targets of a perturbation are indices that start at 1, and a short circuit removal points to the
// short circuit it clears, so the target of that short circuit is used instead.
function eventTarget(description, eventIndex) {
  let event = description.perturbations[eventIndex];
  for (let depth = 0; depth < 3 && event !== undefined; depth++) {
    const targets = event.targets;
    for (const kind of ["bus", "circuit", "generator", "load"]) {
      if (kind in targets) {
        return { kind: kind, index: targets[kind] - 1 };
      }
    }
    if (!("short_circuit" in targets)) {
      return null;
    }
    event = description.perturbations[targets.short_circuit - 1];
  }
  return null;
}

function elementTitle(description, target) {
  if (target === null) {
    return "";
  }
  const element = elementOf(description, target.kind, target.index);
  if (element === null) {
    return "";
  }
  return kindLabel(target.kind, element) + " " + element.name;
}

function currentDescriptionCase() {
  if (state.diagramCase !== null) {
    const chosen = findCase(state.diagramCase);
    if (chosen !== null && chosen.description !== null) {
      return chosen;
    }
  }
  for (const caseData of store.cases) {
    if (caseData.description !== null) {
      state.diagramCase = caseData.name;
      return caseData;
    }
  }
  return null;
}

// ---------------------------------------------------------------- Diagram layout

function networkSignature(description) {
  const names = [];
  for (const bus of description.buses) {
    names.push(bus.name);
  }
  return names.join("|");
}

// Spring layout of Fruchterman and Reingold: every pair of buses repels and every circuit pulls its two
// buses together, while a falling temperature limits how far a bus moves in each iteration.
function computeForceLayout(description) {
  const count = description.buses.length;
  const positions = [];
  for (let i = 0; i < count; i++) {
    const angle = (2 * Math.PI * i) / count;
    // A small fixed offset breaks the symmetry of the circle, so the layout is the same at every run.
    const jitter = 0.02 * Math.sin(i * 12.9898);
    positions.push({ x: 0.5 + 0.4 * Math.cos(angle) + jitter, y: 0.5 + 0.4 * Math.sin(angle) - jitter });
  }

  const edges = [];
  for (const circuit of description.circuits) {
    if (circuit.from !== circuit.to) {
      edges.push([circuit.from - 1, circuit.to - 1]);
    }
  }

  const k = Math.sqrt(1 / Math.max(count, 1));
  const iterations = 600;
  for (let iteration = 0; iteration < iterations; iteration++) {
    const temperature = 0.1 * (1 - iteration / iterations) + 0.002;
    const moves = [];
    for (let i = 0; i < count; i++) {
      moves.push({ x: 0, y: 0 });
    }
    for (let i = 0; i < count; i++) {
      for (let j = i + 1; j < count; j++) {
        const dx = positions[i].x - positions[j].x;
        const dy = positions[i].y - positions[j].y;
        const distance = Math.max(Math.hypot(dx, dy), 0.01);
        const force = (k * k) / distance;
        moves[i].x += (dx / distance) * force;
        moves[i].y += (dy / distance) * force;
        moves[j].x -= (dx / distance) * force;
        moves[j].y -= (dy / distance) * force;
      }
    }
    for (const edge of edges) {
      const a = edge[0];
      const b = edge[1];
      const dx = positions[a].x - positions[b].x;
      const dy = positions[a].y - positions[b].y;
      const distance = Math.max(Math.hypot(dx, dy), 0.01);
      const force = (distance * distance) / k;
      moves[a].x -= (dx / distance) * force;
      moves[a].y -= (dy / distance) * force;
      moves[b].x += (dx / distance) * force;
      moves[b].y += (dy / distance) * force;
    }
    for (let i = 0; i < count; i++) {
      const length = Math.hypot(moves[i].x, moves[i].y);
      if (length > 0) {
        const step = Math.min(length, temperature);
        positions[i].x += (moves[i].x / length) * step;
        positions[i].y += (moves[i].y / length) * step;
      }
    }
  }
  return normalizeLayout(positions);
}

// Stretches the positions to fill the unit square.
function normalizeLayout(positions) {
  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;
  for (const position of positions) {
    minX = Math.min(minX, position.x);
    maxX = Math.max(maxX, position.x);
    minY = Math.min(minY, position.y);
    maxY = Math.max(maxY, position.y);
  }
  const spanX = Math.max(maxX - minX, 1e-9);
  const spanY = Math.max(maxY - minY, 1e-9);
  const normalized = [];
  for (const position of positions) {
    normalized.push({ x: (position.x - minX) / spanX, y: (position.y - minY) / spanY });
  }
  return normalized;
}

function readStoredLayout(signature, count) {
  let positions = null;
  try {
    const text = window.localStorage.getItem(layoutStoragePrefix() + signature);
    if (text !== null) {
      positions = JSON.parse(text);
    }
  } catch (error) {
    return null;
  }
  if (!Array.isArray(positions) || positions.length !== count) {
    return null;
  }
  for (const position of positions) {
    if (typeof position.x !== "number" || typeof position.y !== "number") {
      return null;
    }
  }
  return positions;
}

// The positions are kept per network, so the cases of the same system share the arrangement chosen by hand.
function layoutFor(description) {
  const signature = networkSignature(description);
  if (signature in layoutCache) {
    return layoutCache[signature];
  }
  let positions = readStoredLayout(signature, description.buses.length);
  if (positions === null) {
    positions = computeForceLayout(description);
  }
  layoutCache[signature] = positions;
  return positions;
}

function saveLayout(description) {
  const signature = networkSignature(description);
  try {
    window.localStorage.setItem(layoutStoragePrefix() + signature, JSON.stringify(layoutCache[signature]));
  } catch (error) {
    // Without storage the arrangement only lasts until the page is closed.
  }
}

function resetLayout() {
  const caseData = currentDescriptionCase();
  if (caseData === null) {
    return;
  }
  const signature = networkSignature(caseData.description);
  delete layoutCache[signature];
  try {
    window.localStorage.removeItem(layoutStoragePrefix() + signature);
  } catch (error) {
    // The stored arrangement may stay, but the page already shows the automatic one.
  }
  drawDiagram();
}

// Parallel circuits between the same two buses are shifted apart, so each one can be clicked.
function circuitOffsets(description) {
  const seen = {};
  const offsets = [];
  for (const circuit of description.circuits) {
    const low = Math.min(circuit.from, circuit.to);
    const high = Math.max(circuit.from, circuit.to);
    const pair = low + "-" + high;
    if (!(pair in seen)) {
      seen[pair] = 0;
    }
    offsets.push(seen[pair] * 12);
    seen[pair] += 1;
  }
  return offsets;
}

// Each bus is a horizontal bar, longer when more circuits connect to it.
function busGeometry(view) {
  const description = view.description;
  const counts = [];
  for (let i = 0; i < description.buses.length; i++) {
    counts.push(0);
  }
  for (const circuit of description.circuits) {
    counts[circuit.from - 1] += 1;
    counts[circuit.to - 1] += 1;
  }

  const padding = view.padding;
  const plotWidth = view.width - padding.left - padding.right;
  const plotHeight = view.height - padding.top - padding.bottom;
  const buses = [];
  for (let i = 0; i < description.buses.length; i++) {
    const position = view.positions[i];
    const half = clamp(24 + 7 * counts[i], 32, 70);
    buses.push({ x: padding.left + position.x * plotWidth, y: padding.top + position.y * plotHeight, half: half });
  }
  return buses;
}

// A circuit leaves its bar at the point closest to the other bus, so the wires spread along the bar.
function attachPoint(bus, other, offset) {
  const low = bus.x - bus.half + 6;
  const high = bus.x + bus.half - 6;
  const x = clamp(other.x + offset, low, high);
  return { x: x, y: bus.y };
}

function circuitEnds(view, index) {
  const circuit = view.description.circuits[index];
  const from = view.buses[circuit.from - 1];
  const to = view.buses[circuit.to - 1];
  const offset = view.offsets[index];
  return { a: attachPoint(from, to, offset), b: attachPoint(to, from, offset) };
}

// Generators hang above their bar and loads and shunts below it, spread when a bus has more than one.
function decorationLayout(view) {
  const description = view.description;
  const above = [];
  const below = [];
  for (let i = 0; i < description.buses.length; i++) {
    above.push([]);
    below.push([]);
  }
  for (let g = 0; g < description.generators.length; g++) {
    above[description.generators[g].bus - 1].push(g);
  }
  for (let l = 0; l < description.loads.length; l++) {
    below[description.loads[l].bus - 1].push({ kind: "load", index: l });
  }
  for (let b = 0; b < description.buses.length; b++) {
    const susceptance = quantityValue(description.buses[b].parameters, "B_shunt", "pu");
    if (!Number.isNaN(susceptance) && susceptance !== 0) {
      below[b].push({ kind: "shunt", index: b });
    }
  }

  const generators = [];
  const loads = [];
  const shunts = [];
  for (let b = 0; b < description.buses.length; b++) {
    const bus = view.buses[b];
    const aboveCount = above[b].length;
    for (let j = 0; j < aboveCount; j++) {
      const x = bus.x + (j - (aboveCount - 1) / 2) * 30;
      generators[above[b][j]] = { x: x, y: bus.y - 38, busY: bus.y };
    }
    const belowCount = below[b].length;
    for (let j = 0; j < belowCount; j++) {
      const item = below[b][j];
      const x = bus.x + (j - (belowCount - 1) / 2) * 24;
      if (item.kind === "load") {
        loads[item.index] = { x: x, busY: bus.y };
      } else {
        shunts.push({ bus: b, x: x, busY: bus.y });
      }
    }
  }
  return { generators: generators, loads: loads, shunts: shunts };
}

// ---------------------------------------------------------------- Diagram drawing

function selectedClass(kind, index) {
  const selected = state.selectedElement;
  if (selected !== null && selected.kind === kind && selected.index === index) {
    return " selected";
  }
  return "";
}

function circuitSvg(view, index) {
  const circuit = view.description.circuits[index];
  const ends = circuitEnds(view, index);
  const a = ends.a;
  const b = ends.b;
  let svg = `<g class="dg-el${selectedClass("circuit", index)}" data-kind="circuit" data-index="${index}">`;
  svg += `<line class="dg-hit" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="12"/>`;
  svg += `<line class="dg-ink dg-wire" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
  if (circuit.type === "transformer") {
    const length = Math.max(Math.hypot(b.x - a.x, b.y - a.y), 1e-9);
    const ux = (b.x - a.x) / length;
    const uy = (b.y - a.y) / length;
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;
    svg += `<circle class="dg-ink dg-device" cx="${mx - ux * 4.5}" cy="${my - uy * 4.5}" r="7"/>`;
    svg += `<circle class="dg-ink dg-device" cx="${mx + ux * 4.5}" cy="${my + uy * 4.5}" r="7"/>`;
  }
  svg += "</g>";
  return svg;
}

function generatorSvg(position, index) {
  const x = position.x;
  const y = position.y;
  const radius = 12;
  let svg = `<g class="dg-el${selectedClass("generator", index)}" data-kind="generator" data-index="${index}">`;
  svg += `<line class="dg-ink" x1="${x}" y1="${position.busY}" x2="${x}" y2="${y + radius}" stroke-width="1.6"/>`;
  svg += `<circle class="dg-ink dg-device" cx="${x}" cy="${y}" r="${radius}"/>`;
  svg += `<path class="dg-ink" d="M${x - 6} ${y} Q${x - 3} ${y - 6} ${x} ${y} T${x + 6} ${y}" stroke-width="1.6"/>`;
  svg += "</g>";
  return svg;
}

function loadSvg(position, index) {
  const x = position.x;
  const y = position.busY;
  let svg = `<g class="dg-el${selectedClass("load", index)}" data-kind="load" data-index="${index}">`;
  svg += `<line class="dg-hit" x1="${x}" y1="${y}" x2="${x}" y2="${y + 30}" stroke-width="12"/>`;
  svg += `<line class="dg-ink" x1="${x}" y1="${y}" x2="${x}" y2="${y + 22}" stroke-width="1.6"/>`;
  svg += `<polygon class="dg-fill" points="${x - 5},${y + 21} ${x + 5},${y + 21} ${x},${y + 30}"/>`;
  svg += "</g>";
  return svg;
}

// The shunt belongs to the bus in the model, so clicking it opens the bus.
function shuntSvg(item) {
  const x = item.x;
  const y = item.busY;
  let svg = `<g class="dg-el" data-kind="bus" data-index="${item.bus}">`;
  svg += `<line class="dg-hit" x1="${x}" y1="${y}" x2="${x}" y2="${y + 34}" stroke-width="14"/>`;
  svg += `<line class="dg-ink" x1="${x}" y1="${y}" x2="${x}" y2="${y + 14}" stroke-width="1.6"/>`;
  svg += `<line class="dg-ink" x1="${x - 8}" y1="${y + 14}" x2="${x + 8}" y2="${y + 14}" stroke-width="1.6"/>`;
  svg += `<line class="dg-ink" x1="${x - 8}" y1="${y + 19}" x2="${x + 8}" y2="${y + 19}" stroke-width="1.6"/>`;
  svg += `<line class="dg-ink" x1="${x}" y1="${y + 19}" x2="${x}" y2="${y + 26}" stroke-width="1.6"/>`;
  svg += `<line class="dg-ink" x1="${x - 6}" y1="${y + 26}" x2="${x + 6}" y2="${y + 26}" stroke-width="1.6"/>`;
  svg += `<line class="dg-ink" x1="${x - 4}" y1="${y + 29}" x2="${x + 4}" y2="${y + 29}" stroke-width="1.6"/>`;
  svg += `<line class="dg-ink" x1="${x - 2}" y1="${y + 32}" x2="${x + 2}" y2="${y + 32}" stroke-width="1.6"/>`;
  svg += "</g>";
  return svg;
}

function busSvg(bus, index) {
  const left = bus.x - bus.half;
  const right = bus.x + bus.half;
  let svg = `<g class="dg-el dg-bus${selectedClass("bus", index)}" data-kind="bus" data-index="${index}">`;
  svg += `<line class="dg-hit" x1="${left}" y1="${bus.y}" x2="${right}" y2="${bus.y}" stroke-width="16"/>`;
  svg += `<line class="dg-ink dg-bar" x1="${left}" y1="${bus.y}" x2="${right}" y2="${bus.y}"/>`;
  svg += "</g>";
  return svg;
}

function busLabelSvg(busData, bus) {
  const x = bus.x + bus.half + 6;
  const magnitude = quantityValue(busData.initial, "V", "pu");
  const angle = quantityValue(busData.initial, "theta", "deg");
  const voltage = formatFixed(magnitude, 3) + " ∠ " + formatFixed(angle, 1) + "°";
  let svg = `<text class="dg-label" x="${x}" y="${bus.y - 2}">${escapeHtml(busData.name)}</text>`;
  svg += `<text class="dg-sublabel" x="${x}" y="${bus.y + 11}">${voltage}</text>`;
  return svg;
}

function boltSvg(x, y) {
  return `<path class="dg-event-mark" d="M${x + 3} ${y - 11} L${x - 4} ${y + 1} L${x} ${y + 1} L${x - 2} ${y + 11} L${x + 5} ${y - 2} L${x + 1} ${y - 2} Z"/>`;
}

function crossSvg(x, y) {
  let svg = `<circle class="dg-event-back" cx="${x}" cy="${y}" r="7"/>`;
  svg += `<line class="dg-event-cross" x1="${x - 4}" y1="${y - 4}" x2="${x + 4}" y2="${y + 4}"/>`;
  svg += `<line class="dg-event-cross" x1="${x - 4}" y1="${y + 4}" x2="${x + 4}" y2="${y - 4}"/>`;
  return svg;
}

// A short circuit is a bolt next to its bus and a trip is a cross on the element. The removal of a short
// circuit is not drawn, because its short circuit already is.
function eventSvg(view, eventIndex) {
  const event = view.description.perturbations[eventIndex];
  if ("short_circuit" in event.targets) {
    return "";
  }
  const target = eventTarget(view.description, eventIndex);
  if (target === null) {
    return "";
  }

  let mark = "";
  if (target.kind === "bus") {
    const bus = view.buses[target.index];
    mark = boltSvg(bus.x - bus.half - 14, bus.y);
  } else if (target.kind === "circuit") {
    const ends = circuitEnds(view, target.index);
    const x = ends.a.x + 0.3 * (ends.b.x - ends.a.x);
    const y = ends.a.y + 0.3 * (ends.b.y - ends.a.y);
    mark = crossSvg(x, y);
  } else if (target.kind === "generator") {
    const position = view.decorations.generators[target.index];
    mark = crossSvg(position.x + 11, position.y - 11);
  } else if (target.kind === "load") {
    const position = view.decorations.loads[target.index];
    mark = crossSvg(position.x + 9, position.busY + 24);
  }
  if (mark === "") {
    return "";
  }
  return `<g class="dg-el" data-kind="event" data-index="${eventIndex}">${mark}</g>`;
}

function drawDiagram() {
  const container = document.getElementById("diagram");
  const caseData = currentDescriptionCase();
  if (caseData === null) {
    diagramView = null;
    container.innerHTML =
      '<div class="no-series">Este resultado não tem o arquivo case.json, que descreve a rede. ' +
      "Rode o caso de novo com a versão atual do nsLFT para ver o diagrama.</div>";
    return;
  }

  const description = caseData.description;
  const width = Math.max(container.clientWidth, 480);
  let height = Math.round(width * 0.56);
  height = clamp(height, 440, 760);
  const view = {
    description: description,
    positions: layoutFor(description),
    width: width,
    height: height,
    padding: diagramPadding(),
    offsets: circuitOffsets(description),
  };
  view.buses = busGeometry(view);
  view.decorations = decorationLayout(view);
  diagramView = view;

  // The wires go first so the bars, the devices and the labels are drawn over them.
  let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
  for (let c = 0; c < description.circuits.length; c++) {
    svg += circuitSvg(view, c);
  }
  for (let g = 0; g < description.generators.length; g++) {
    svg += generatorSvg(view.decorations.generators[g], g);
  }
  for (let l = 0; l < description.loads.length; l++) {
    svg += loadSvg(view.decorations.loads[l], l);
  }
  for (const shunt of view.decorations.shunts) {
    svg += shuntSvg(shunt);
  }
  for (let b = 0; b < description.buses.length; b++) {
    svg += busSvg(view.buses[b], b);
  }
  for (let b = 0; b < description.buses.length; b++) {
    svg += busLabelSvg(description.buses[b], view.buses[b]);
  }
  for (let p = 0; p < description.perturbations.length; p++) {
    svg += eventSvg(view, p);
  }
  svg += "</svg>";
  container.innerHTML = svg;
}

// ---------------------------------------------------------------- Diagram page

function renderDiagramCasePicker() {
  const picker = document.getElementById("diagram-case-picker");
  const described = [];
  for (const caseData of store.cases) {
    if (caseData.description !== null) {
      described.push(caseData.name);
    }
  }
  if (described.length < 2) {
    picker.innerHTML = "";
    return;
  }
  let html = '<div class="chips">';
  for (const name of described) {
    let on = "";
    if (name === state.diagramCase) {
      on = " on";
    }
    const escaped = escapeHtml(name);
    html += `<button class="chip${on}" data-action="set-diagram-case" data-case="${escaped}">${escaped}</button>`;
  }
  html += "</div>";
  picker.innerHTML = html;
}

function factHtml(label, value) {
  return `<div class="fact"><div class="fact-label">${escapeHtml(label)}</div><div class="fact-value">${escapeHtml(value)}</div></div>`;
}

function renderFacts(caseData) {
  const facts = document.getElementById("case-facts");
  if (caseData === null) {
    facts.innerHTML = "";
    return;
  }
  const description = caseData.description;
  const system = description.system;
  const Sb = quantityValue(system, "Sb", "MVA");
  const fb = quantityValue(system, "fb", "Hz");
  const step = quantityValue(system, "integration_step", "s");
  const horizon = quantityValue(system, "simulation_horizon", "s");

  const models = [];
  for (const generator of description.generators) {
    const info = describeModel(generator.model);
    if (!models.includes(info.name)) {
      models.push(info.name);
    }
  }

  let html = "";
  html += factHtml("Base", formatValue(Sb) + " MVA · " + formatValue(fb) + " Hz");
  html += factHtml("Integração", "Δt " + formatValue(step) + " s · T " + formatValue(horizon) + " s");
  html += factHtml("Rede", description.buses.length + " barras · " + description.circuits.length + " circuitos");
  html += factHtml("Injeções", description.generators.length + " geradores · " + description.loads.length + " cargas");
  html += factHtml("Modelo dos geradores", models.join(", "));
  facts.innerHTML = html;
}

function compareByTime(a, b) {
  return a.time - b.time;
}

function renderEvents(caseData) {
  const list = document.getElementById("events-list");
  if (caseData === null) {
    list.innerHTML = '<p class="hint">Sem descrição do caso.</p>';
    return;
  }
  const description = caseData.description;
  const order = [];
  for (let p = 0; p < description.perturbations.length; p++) {
    order.push({ index: p, time: description.perturbations[p].time });
  }
  order.sort(compareByTime);
  if (order.length === 0) {
    list.innerHTML = '<p class="hint">Este caso não tem perturbações.</p>';
    return;
  }

  let html = "";
  for (const item of order) {
    const event = description.perturbations[item.index];
    const target = eventTarget(description, item.index);
    const targetText = elementTitle(description, target);
    html +=
      `<button class="event-row" data-action="select-event" data-index="${item.index}">` +
      `<span class="time-badge">t = ${formatValue(event.time)} s</span>` +
      `<span><span class="event-type">${escapeHtml(eventTypeLabel(event.type))}</span> ` +
      `<span class="event-name">${escapeHtml(event.name)}</span></span>` +
      `<span class="event-target">${escapeHtml(targetText)}</span></button>`;
  }
  list.innerHTML = html;
}

function quantityTable(kind, quantities) {
  if (!Array.isArray(quantities) || quantities.length === 0) {
    return '<p class="section-note">Sem valores.</p>';
  }
  let html = '<table class="q-table"><tbody>';
  for (const quantity of quantities) {
    const info = describeQuantity(kind, quantity.key);
    let value = "–";
    let alternatives = "";
    if (quantity.values.length > 0) {
      value = formatEntry(quantity.values[0]);
    }
    const others = [];
    for (let i = 1; i < quantity.values.length; i++) {
      others.push(formatEntry(quantity.values[i]));
    }
    if (others.length > 0) {
      alternatives = `<span class="q-alt">${escapeHtml(others.join(" · "))}</span>`;
    }
    let label = "";
    if (info.label !== "") {
      label = `<span class="q-label">${escapeHtml(info.label)}</span>`;
    }
    html +=
      `<tr><td><span class="q-symbol">${escapeHtml(info.symbol)}</span>${label}</td>` +
      `<td class="q-value">${escapeHtml(value)}${alternatives}</td></tr>`;
  }
  html += "</tbody></table>";
  return html;
}

function elementChip(kind, index, label) {
  return `<button class="chip" data-action="select-element" data-kind="${kind}" data-index="${index}">${escapeHtml(label)}</button>`;
}

function connectionsHtml(description, kind, index) {
  let chips = "";
  if (kind === "bus") {
    for (let g = 0; g < description.generators.length; g++) {
      if (description.generators[g].bus - 1 === index) {
        chips += elementChip("generator", g, description.generators[g].name);
      }
    }
    for (let l = 0; l < description.loads.length; l++) {
      if (description.loads[l].bus - 1 === index) {
        chips += elementChip("load", l, description.loads[l].name);
      }
    }
    for (let c = 0; c < description.circuits.length; c++) {
      const circuit = description.circuits[c];
      if (circuit.from - 1 === index || circuit.to - 1 === index) {
        chips += elementChip("circuit", c, circuit.name);
      }
    }
  } else if (kind === "circuit") {
    const circuit = description.circuits[index];
    chips += elementChip("bus", circuit.from - 1, "De " + description.buses[circuit.from - 1].name);
    chips += elementChip("bus", circuit.to - 1, "Para " + description.buses[circuit.to - 1].name);
  } else {
    const element = elementOf(description, kind, index);
    chips += elementChip("bus", element.bus - 1, description.buses[element.bus - 1].name);
  }
  return `<h4>Conexões</h4><div class="chips">${chips}</div>`;
}

function elementEventsHtml(description, kind, index) {
  let rows = "";
  for (let p = 0; p < description.perturbations.length; p++) {
    const target = eventTarget(description, p);
    if (target === null || target.kind !== kind || target.index !== index) {
      continue;
    }
    const event = description.perturbations[p];
    rows +=
      `<div class="event-row"><span class="time-badge">t = ${formatValue(event.time)} s</span>` +
      `<span><span class="event-type">${escapeHtml(eventTypeLabel(event.type))}</span> ` +
      `<span class="event-name">${escapeHtml(event.name)}</span></span></div>`;
    if (event.parameters.length > 0) {
      rows += quantityTable("event", event.parameters);
    }
  }
  if (rows === "") {
    return "";
  }
  return `<h4>Eventos</h4>${rows}`;
}

function modelHtml(kind, element) {
  let model = null;
  if (kind === "generator" || kind === "load") {
    model = element.model;
  } else if (kind === "circuit") {
    model = element.type;
  }
  if (model === null) {
    return "";
  }
  const info = describeModel(model);
  let html = `<h4>Modelo</h4><span class="badge">${escapeHtml(info.name)}</span>`;
  if (info.description !== "") {
    html += `<p class="model-text">${escapeHtml(info.description)}</p>`;
  }
  return html;
}

function renderDetails(caseData) {
  const panel = document.getElementById("details");
  const selected = state.selectedElement;
  if (caseData === null || selected === null) {
    panel.hidden = true;
    panel.innerHTML = "";
    return;
  }
  const description = caseData.description;
  const element = elementOf(description, selected.kind, selected.index);
  if (element === null) {
    state.selectedElement = null;
    panel.hidden = true;
    panel.innerHTML = "";
    return;
  }

  let parametersTitle = "Parâmetros";
  let parametersNote = "";
  if (selected.kind === "bus") {
    parametersTitle = "Dados de entrada";
  } else if (selected.kind === "generator") {
    parametersNote = '<p class="section-note">Valores na base da máquina, como estão nos dados do caso.</p>';
  } else if (selected.kind === "circuit") {
    parametersNote = '<p class="section-note">Valores em pu na base do sistema.</p>';
  }

  let html =
    `<div class="details-head"><div><div class="details-kind">${escapeHtml(kindLabel(selected.kind, element))}</div>` +
    `<h3>${escapeHtml(element.name)}</h3></div>` +
    `<button class="icon-btn" data-action="close-details" aria-label="Fechar" title="Fechar (Esc)">×</button></div>`;
  html += modelHtml(selected.kind, element);
  html += "<h4>Ponto inicial em t = 0 s</h4>";
  html += quantityTable(selected.kind, element.initial);
  html += `<h4>${parametersTitle}</h4>${parametersNote}`;
  html += quantityTable(selected.kind, element.parameters);
  html += connectionsHtml(description, selected.kind, selected.index);
  html += elementEventsHtml(description, selected.kind, selected.index);
  panel.innerHTML = html;
  panel.hidden = false;
}

// The details panel is laid out before the diagram, because it takes width from it.
function renderDiagramPage() {
  const caseData = currentDescriptionCase();
  renderDiagramCasePicker();
  renderFacts(caseData);
  renderDetails(caseData);
  renderEvents(caseData);
  drawDiagram();
}

function selectElement(kind, index) {
  const caseData = currentDescriptionCase();
  if (caseData === null) {
    return;
  }
  let target = { kind: kind, index: index };
  if (kind === "event") {
    target = eventTarget(caseData.description, index);
    if (target === null) {
      return;
    }
  }
  state.selectedElement = target;
  hideTooltip();
  renderDiagramPage();
  document.getElementById("details").scrollTop = 0;
}

function closeDetails() {
  state.selectedElement = null;
  renderDiagramPage();
}

function hideTooltip() {
  document.getElementById("tooltip").style.display = "none";
}

function tooltipRow(label, value) {
  return `<div class="tooltip-row"><span>${escapeHtml(label)}</span><span class="value">${escapeHtml(value)}</span></div>`;
}

function diagramTooltipHtml(description, kind, index) {
  if (kind === "event") {
    const event = description.perturbations[index];
    return (
      `<div class="tooltip-time">t = ${formatValue(event.time)} s</div>` +
      `<div>${escapeHtml(eventTypeLabel(event.type))}</div><div>${escapeHtml(event.name)}</div>` +
      '<div class="tooltip-hint">Clique para ver o elemento</div>'
    );
  }
  const element = elementOf(description, kind, index);
  if (element === null) {
    return "";
  }

  let rows = "";
  if (kind === "bus") {
    rows += tooltipRow("|V|", formatFixed(quantityValue(element.initial, "V", "pu"), 4) + " pu");
    rows += tooltipRow("θ", formatFixed(quantityValue(element.initial, "theta", "deg"), 2) + "°");
  } else if (kind === "circuit") {
    const fromName = description.buses[element.from - 1].name;
    const toName = description.buses[element.to - 1].name;
    rows += tooltipRow("P " + fromName + " → " + toName, formatFixed(quantityValue(element.initial, "P_from", "MW"), 2) + " MW");
    rows += tooltipRow("Q " + fromName + " → " + toName, formatFixed(quantityValue(element.initial, "Q_from", "Mvar"), 2) + " Mvar");
  } else if (kind === "generator") {
    rows += tooltipRow("P", formatFixed(quantityValue(element.initial, "P_terminal", "MW"), 2) + " MW");
    rows += tooltipRow("Q", formatFixed(quantityValue(element.initial, "Q_terminal", "Mvar"), 2) + " Mvar");
    rows += tooltipRow("Modelo", describeModel(element.model).name);
  } else if (kind === "load") {
    rows += tooltipRow("P", formatFixed(quantityValue(element.initial, "P", "MW"), 2) + " MW");
    rows += tooltipRow("Q", formatFixed(quantityValue(element.initial, "Q", "Mvar"), 2) + " Mvar");
  }
  return (
    `<div class="tooltip-time">${escapeHtml(kindLabel(kind, element))} ${escapeHtml(element.name)}</div>` +
    rows +
    '<div class="tooltip-hint">Clique para ver os detalhes</div>'
  );
}

function onDiagramPointerDown(event) {
  if (event.button !== 0) {
    return;
  }
  const element = event.target.closest("[data-kind]");
  if (element === null) {
    return;
  }
  pointerTarget = {
    kind: element.dataset.kind,
    index: Number(element.dataset.index),
    startX: event.clientX,
    startY: event.clientY,
    moved: false,
  };
  if (pointerTarget.kind === "bus") {
    // The capture stays on the container, because the drawing is replaced while the bus moves.
    event.currentTarget.setPointerCapture(event.pointerId);
    event.preventDefault();
  }
}

function moveBus(index, clientX, clientY) {
  const view = diagramView;
  const svg = document.querySelector("#diagram svg");
  if (view === null || svg === null) {
    return;
  }
  const rect = svg.getBoundingClientRect();
  const padding = view.padding;
  const plotWidth = view.width - padding.left - padding.right;
  const plotHeight = view.height - padding.top - padding.bottom;
  let x = (clientX - rect.left - padding.left) / plotWidth;
  let y = (clientY - rect.top - padding.top) / plotHeight;
  x = clamp(x, 0, 1);
  y = clamp(y, 0, 1);
  view.positions[index] = { x: x, y: y };
  drawDiagram();
}

// A pointer that moves more than a few pixels over a bus drags it, and a still one opens the details.
function onDiagramPointerMove(event) {
  if (pointerTarget !== null && pointerTarget.kind === "bus") {
    const distance = Math.hypot(event.clientX - pointerTarget.startX, event.clientY - pointerTarget.startY);
    if (!pointerTarget.moved && distance < 4) {
      return;
    }
    pointerTarget.moved = true;
    hideTooltip();
    moveBus(pointerTarget.index, event.clientX, event.clientY);
    return;
  }
  const element = event.target.closest("[data-kind]");
  if (element === null || diagramView === null) {
    hideTooltip();
    return;
  }
  const html = diagramTooltipHtml(diagramView.description, element.dataset.kind, Number(element.dataset.index));
  if (html === "") {
    hideTooltip();
    return;
  }
  placeTooltip(html, event.clientX, event.clientY);
}

function onDiagramPointerUp() {
  if (pointerTarget === null) {
    return;
  }
  const target = pointerTarget;
  pointerTarget = null;
  if (target.moved) {
    if (diagramView !== null) {
      saveLayout(diagramView.description);
    }
    return;
  }
  selectElement(target.kind, target.index);
}

function onDiagramPointerCancel() {
  pointerTarget = null;
}

function onDiagramPointerLeave() {
  if (pointerTarget === null) {
    hideTooltip();
  }
}

// ---------------------------------------------------------------- Actions

function handleAction(element) {
  const action = element.dataset.action;
  if (action === "toggle-variable") {
    toggleInList(state.selectedVariables, element.dataset.key);
  } else if (action === "clear-variables") {
    state.selectedVariables = [];
  } else if (action === "toggle-case") {
    toggleInList(state.selectedCases, element.dataset.case);
  } else if (action === "toggle-elements-menu") {
    toggleElementsMenu(element.dataset.chart);
    return;
  } else if (action === "toggle-element") {
    const hidden = editableHiddenElements(element.dataset.chart);
    toggleInList(hidden, element.dataset.element);
  } else if (action === "elements-all") {
    showAllElements(element.dataset.chart, element.dataset.cls);
  } else if (action === "elements-none") {
    hideAllElements(element.dataset.chart, element.dataset.cls);
  } else if (action === "toggle-series") {
    toggleInList(state.hiddenSeries, element.dataset.series);
  } else if (action === "set-mode") {
    state.mode = element.dataset.mode;
  } else if (action === "reset-zoom") {
    resetZoom();
  } else if (action === "open-folder") {
    document.getElementById("folder-input").click();
    return;
  } else if (action === "set-tab") {
    setTab(element.dataset.tab);
  } else if (action === "select-element") {
    selectElement(element.dataset.kind, Number(element.dataset.index));
    return;
  } else if (action === "select-event") {
    selectElement("event", Number(element.dataset.index));
    return;
  } else if (action === "close-details") {
    closeDetails();
    return;
  } else if (action === "set-diagram-case") {
    state.diagramCase = element.dataset.case;
    state.selectedElement = null;
    renderDiagramPage();
    return;
  } else if (action === "reset-layout") {
    resetLayout();
    return;
  } else {
    return;
  }
  saveState();
  renderAll();
}

function setTab(tab) {
  state.tab = tab;
  let hash = "#diagrama";
  if (tab === "charts") {
    hash = "#graficos";
  }
  try {
    window.history.replaceState(null, "", hash);
  } catch (error) {
    // Some pages opened from the disk refuse to change the address, and the tab still changes.
  }
}

function tabFromAddress() {
  if (window.location.hash === "#graficos") {
    return "charts";
  }
  if (window.location.hash === "#diagrama") {
    return "diagram";
  }
  // Without a description there is no diagram to show, so the page opens on the charts.
  for (const caseData of store.cases) {
    if (caseData.description !== null) {
      return "diagram";
    }
  }
  return "charts";
}

// Opening a menu only shows it, because the menus are already in the page with the charts.
function toggleElementsMenu(chartId) {
  const wasOpen = state.openElementsMenu === chartId;
  closeElementsMenu();
  if (wasOpen) {
    return;
  }
  state.openElementsMenu = chartId;
  const menus = document.querySelectorAll(".elements-menu");
  for (const menu of menus) {
    if (menu.dataset.chart === chartId) {
      menu.hidden = false;
    }
  }
  const buttons = document.querySelectorAll(".tool-btn");
  for (const button of buttons) {
    if (button.dataset.chart === chartId) {
      button.classList.add("open");
      button.setAttribute("aria-expanded", "true");
    }
  }
}

function showAllElements(chartId, cls) {
  const prefix = cls + "|";
  const kept = [];
  for (const id of hiddenElementsOf(chartId)) {
    if (!id.startsWith(prefix)) {
      kept.push(id);
    }
  }
  state.hiddenElements[chartId] = kept;
}

function hideAllElements(chartId, cls) {
  const spec = findChart(chartId);
  if (spec === null) {
    return;
  }
  const hidden = editableHiddenElements(chartId);
  for (const group of chartElementGroups(spec)) {
    if (group.cls !== cls) {
      continue;
    }
    for (const name of group.names) {
      const id = elementId(cls, name);
      if (!hidden.includes(id)) {
        hidden.push(id);
      }
    }
  }
}

function findChart(chartId) {
  for (const spec of charts) {
    if (spec.id === chartId) {
      return spec;
    }
  }
  return null;
}

// A click outside the open menu closes it, while the clicks inside it keep it open.
function onDocumentClick(event) {
  const element = event.target.closest("[data-action]");
  const insideTools = event.target.closest(".card-tools");
  if (insideTools === null) {
    closeElementsMenu();
  }
  if (element === null) {
    return;
  }
  handleAction(element);
}

function onDocumentKeyDown(event) {
  if (event.key === "Escape") {
    closeElementsMenu();
    if (state.tab === "diagram" && state.selectedElement !== null) {
      closeDetails();
    }
  }
}

function onSearchInput(event) {
  state.search = event.target.value;
  renderVariables();
}

function onFolderChosen(event) {
  const files = event.target.files;
  loadFolder(files);
  // Clearing the input lets the same folder be chosen again after a new run.
  event.target.value = "";
}

function onResizeFrame() {
  resizeScheduled = false;
  if (state.tab === "charts") {
    renderCharts();
  } else {
    drawDiagram();
  }
}

function onWindowResize() {
  if (resizeScheduled) {
    return;
  }
  resizeScheduled = true;
  window.requestAnimationFrame(onResizeFrame);
}

function init() {
  loadEmbeddedData();
  restoreState();
  ensureDefaults();
  state.tab = tabFromAddress();

  document.addEventListener("click", onDocumentClick);
  document.addEventListener("keydown", onDocumentKeyDown);
  document.getElementById("search").addEventListener("input", onSearchInput);
  document.getElementById("folder-input").addEventListener("change", onFolderChosen);

  const container = document.getElementById("charts");
  container.addEventListener("mousemove", onChartsMouseMove);
  container.addEventListener("mousedown", onChartsMouseDown);
  container.addEventListener("dblclick", onChartsDoubleClick);
  container.addEventListener("mouseover", onChartsMouseOver);
  container.addEventListener("mouseleave", onChartsMouseLeave);
  window.addEventListener("mouseup", onWindowMouseUp);
  window.addEventListener("resize", onWindowResize);

  const diagram = document.getElementById("diagram");
  diagram.addEventListener("pointerdown", onDiagramPointerDown);
  diagram.addEventListener("pointermove", onDiagramPointerMove);
  diagram.addEventListener("pointerup", onDiagramPointerUp);
  diagram.addEventListener("pointercancel", onDiagramPointerCancel);
  diagram.addEventListener("pointerleave", onDiagramPointerLeave);

  renderAll();
}

init();
</script>
